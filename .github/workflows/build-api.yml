name: Build and Test API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"

    - name: Restore packages
      run: dotnet restore RaceDay.slnx

    - name: Build solution
      run: dotnet build RaceDay.slnx --no-restore

    - name: Run unit tests
      run: dotnet test RaceDay.slnx --no-build --logger "console;verbosity=normal"
